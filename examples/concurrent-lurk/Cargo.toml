[package]
name = "concurrent-lurk"
version = "0.1.0"
authors = ["Lurk Lab Systems <winston@lurk-lab.com>"] # TODO UPDATE EMAIL
edition = "2021"

[dependencies]
async-graphql.workspace = true
linera-sdk.workspace = true
log.workspace = true
serde.workspace = true
serde_json = "1.0"
# Native features
chrono = { version = "0.4", optional = true }
regex = { version = "1.5", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
linera-sdk = { workspace = true, features = ["test", "wasmer"] }
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
linera-sdk = { workspace = true, features = ["test"] }
serde_json.workspace = true
test-log.workspace = true

[[bin]]
name = "concurrent_lurk_contract"
path = "src/contract.rs"

[[bin]]
name = "concurrent_lurk_service"
path = "src/service.rs"

[[bin]]
name = "parse_logs"
path = "src/bin/parse_logs.rs"
required-features = ["native"]

[[bin]]
name = "generate_ping_pong"
path = "src/bin/generate_ping_pong.rs"
required-features = ["native"]

[features]
native = ["chrono", "regex"]
